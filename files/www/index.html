<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBDclaw 410</title>
  <style>
    :root { --ink:#12211f; --muted:#58706c; --line:#d2dfda; --bg:#eef4f1; --card:#fff; --accent:#d7562d; --deep:#153c39; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.6 Georgia, "Noto Serif SC", serif; }
    main { max-width:880px; margin:auto; padding:28px 20px 56px; }
    header { padding:34px 30px; color:#fff; background:var(--deep); border-radius:8px; }
    .eyebrow { margin:0 0 8px; color:#b8d8c5; font:700 12px/1.3 ui-monospace, monospace; letter-spacing:1px; }
    h1 { margin:0; font-size:38px; line-height:1.15; letter-spacing:0; }
    header p { max-width:620px; margin:12px 0 0; color:#dcebe3; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
    section { padding:22px; background:var(--card); border:1px solid var(--line); border-radius:7px; }
    section.wide { grid-column:1 / -1; }
    h2 { margin:0 0 10px; font-size:20px; line-height:1.25; }
    p { margin:8px 0; }
    .muted { color:var(--muted); }
    code { padding:2px 5px; color:#193d38; background:#e8f0ec; font:13px ui-monospace, monospace; }
    button { appearance:none; border:0; border-radius:5px; padding:10px 14px; color:#fff; background:var(--accent); cursor:pointer; font:600 14px ui-monospace, monospace; }
    button.secondary { background:var(--deep); }
    input { width:100%; margin:8px 0 10px; padding:10px; border:1px solid var(--line); border-radius:5px; font:14px ui-monospace, monospace; }
    pre { min-height:130px; max-height:380px; overflow:auto; padding:14px; color:#dcebe3; background:#102826; border-radius:5px; font:12px/1.55 ui-monospace, monospace; white-space:pre-wrap; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    @media (max-width:620px) { main { padding:16px 14px 36px; } header { padding:27px 22px; } h1 { font-size:31px; } .grid { grid-template-columns:1fr; } section.wide { grid-column:auto; } }
  </style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">OBDCLAW / 410</p>
    <h1>车载诊断通信节点</h1>
    <p>本机提供 OBDclaw 的本地连接、诊断服务和维护入口。手机连接 <strong>ImmortalWrt</strong> 热点后即可使用本页面。</p>
  </header>
  <div class="grid">
    <section>
      <h2>本地连接</h2>
      <p>管理地址：<code id="address"></code></p>
      <p class="muted">蓝灯每秒闪烁表示系统运行；红灯熄灭表示没有已定义故障。</p>
    </section>
    <section>
      <h2>设备服务</h2>
      <p><a id="claw" href="#">打开 OBDclaw 服务</a></p>
      <p><a id="luci" href="#">打开设备管理</a></p>
      <p class="muted">设备管理用于网络与系统基础配置。</p>
    </section>
    <section class="wide">
      <h2>运行诊断</h2>
      <div class="actions">
        <button class="secondary" onclick="request('status')">读取状态</button>
        <button class="secondary" onclick="request('logs')">读取最近日志</button>
      </div>
      <pre id="output">等待诊断请求。</pre>
    </section>
    <section class="wide">
      <h2>维护脚本热更新</h2>
      <p class="muted">只用于更新 Shell 维护脚本和服务配置。脚本以 <code>#!/bin/sh</code> 开头，上传后立即以 root 执行；仅应在可信的 ImmortalWrt 局域网内使用。</p>
      <input id="token" type="password" placeholder="维护令牌">
      <input id="script" type="file" accept=".sh,text/x-shellscript">
      <div class="actions"><button onclick="upload()">上传并执行</button></div>
    </section>
  </div>
</main>
<script>
const host = location.host;
document.getElementById('address').textContent = host;
document.getElementById('claw').href = 'http://' + location.hostname + ':18800';
document.getElementById('luci').href = '/cgi-bin/luci';
async function request(action) {
  const output = document.getElementById('output'); output.textContent = '读取中...';
  try { output.textContent = await (await fetch('/cgi-bin/obdclaw-debug.cgi?action=' + action)).text(); }
  catch (e) { output.textContent = '请求失败：' + e; }
}
async function upload() {
  const file = document.getElementById('script').files[0]; const token = document.getElementById('token').value;
  const output = document.getElementById('output');
  if (!file || !token) { output.textContent = '请选择脚本并输入维护令牌。'; return; }
  const bytes = new Uint8Array(await file.arrayBuffer()); let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  output.textContent = '上传并执行中...';
  try {
    const body = token + '\n' + btoa(binary);
    output.textContent = await (await fetch('/cgi-bin/obdclaw-debug.cgi', {method:'POST', headers:{'Content-Type':'text/plain'}, body})).text();
  } catch (e) { output.textContent = '更新失败：' + e; }
}
</script>
</body>
</html>
